# =============================================================================
# MariaDB e Redis compartilhados - Carinho com Você
# =============================================================================
# Execute na raiz: docker compose up -d
# Somente desenvolvimento: root vazio. Não replicar em produção.
# =============================================================================

services:
  mariadb:
    image: mariadb:10.11
    container_name: carinho-mariadb
    restart: always
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1
      - MARIADB_DATABASE=${MARIADB_DATABASE:-carinho-dev}
      - TZ=America/Sao_Paulo
    volumes:
      - /var/lib/mariadb-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - carinho-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis Compartilhado (opcional - pode ser usado por todos os sistemas)
  redis:
    image: redis:7-alpine
    container_name: carinho-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - carinho-network
    command: redis-server --appendonly yes

networks:
  carinho-network:
    driver: bridge
    name: carinho-network

volumes:
  # Datadir real do MariaDB: bind /var/lib/mariadb-data acima (não este volume nomeado).
  mariadb_data:
    name: carinho-mariadb-data
  redis_data:
    name: carinho-redis-data
