# =============================================================================
# Carinho Integrações - Docker Compose
# =============================================================================
# MariaDB compartilhado: docker compose up -d na raiz (arquivo docker-compose.yml)
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carinho-integracoes-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./:/var/www/html
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - php -r 'file_put_contents("/tmp/ep.sh", str_replace(chr(13), "", file_get_contents("/var/www/html/docker-entrypoint.sh")));' && exec bash /tmp/ep.sh apache2-foreground
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8088}}
      DB_CONNECTION: mysql
      DB_HOST: carinho-mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: carinho_integracoes
      # Credenciais no .env montado. ${DB_PASSWORD:-carinho} injeta senha sobre root vazio.
      REDIS_HOST: carinho-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-carinho_integracoes:}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
    networks:
      - carinho-network

  # Worker de fila (queue:work). Não subir farm Horizon neste ciclo.
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carinho-integracoes-horizon
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - php -r 'file_put_contents("/tmp/ep.sh", str_replace(chr(13), "", file_get_contents("/var/www/html/docker-entrypoint.sh")));' && exec bash /tmp/ep.sh php artisan queue:work redis --sleep=3 --tries=3 --memory=128 --timeout=90
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: mysql
      DB_HOST: carinho-mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: carinho_integracoes
      # Credenciais no .env montado. ${DB_PASSWORD:-carinho} injeta senha sobre root vazio.
      REDIS_HOST: carinho-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-carinho_integracoes:}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
    networks:
      - carinho-network

  # Scheduler para tarefas agendadas
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carinho-integracoes-scheduler
    restart: unless-stopped
    mem_limit: 192m
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - php -r 'file_put_contents("/tmp/ep.sh", str_replace(chr(13), "", file_get_contents("/var/www/html/docker-entrypoint.sh")));' && exec bash /tmp/ep.sh bash -c 'while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done'
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: mysql
      DB_HOST: carinho-mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: carinho_integracoes
      # Credenciais no .env montado. ${DB_PASSWORD:-carinho} injeta senha sobre root vazio.
      REDIS_HOST: carinho-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-carinho_integracoes:}
      CACHE_STORE: redis
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
    networks:
      - carinho-network

networks:
  carinho-network:
    external: true
    name: carinho-network
