# =============================================================================
# Carinho Documentos LGPD - Docker Compose
# =============================================================================
# MariaDB compartilhado: docker compose up -d na raiz (arquivo docker-compose.yml)
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carinho-documentos-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8082}}
      DB_CONNECTION: mysql
      DB_HOST: carinho-mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-carinho_documentos_lgpd}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: carinho-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-carinho_documentos_lgpd:}
    networks:
      - carinho-network

networks:
  carinho-network:
    external: true
    name: carinho-network
