# Docker local (porta 8084) e producao no apex carinho.com.vc.
# Este arquivo e o vhost do container; DNS/proxy da nuvem nao esta neste repositorio.
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1 carinho.com.vc
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Hostname legado: 301 para o apex, path preservado.
<VirtualHost *:80>
    ServerName site.carinho.com.vc
    RewriteEngine On
    RewriteRule ^ https://carinho.com.vc%{REQUEST_URI} [L,R=301]
</VirtualHost>
