# =============================================================================
# Carinho Atendimento - Docker Compose
# =============================================================================
# MariaDB compartilhado: docker compose up -d na raiz (arquivo docker-compose.yml)
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carinho-atendimento-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - php -r 'file_put_contents("/tmp/ep.sh", str_replace(chr(13), "", file_get_contents("/var/www/html/docker-entrypoint.sh")));' && exec bash /tmp/ep.sh apache2-foreground
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
      DB_CONNECTION: mysql
      DB_HOST: carinho-mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-carinho_atendimento}
      DB_USERNAME: ${DB_USERNAME:-carinho}
      DB_PASSWORD: ${DB_PASSWORD:-carinho}
      REDIS_HOST: carinho-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-carinho_atendimento:}
      CACHE_STORE: redis
    networks:
      - carinho-network

networks:
  carinho-network:
    external: true
    name: carinho-network
