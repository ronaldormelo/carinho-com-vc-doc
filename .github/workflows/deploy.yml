# CI/CD — merge na main
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   SSH_USER                       usuário SSH da VPS (obrigatório)
#   SSH_PRIVATE_KEY_CARINHO_VPS    chave privada SSH da VPS (obrigatório)
#   SSH_PASSPHRASE                 senha da chave, se houver
#   SSH_PORT                       porta SSH (opcional; padrão 22)
#   SSH_FINGERPRINT                SHA256 do host (opcional; reduz risco de MITM)
#
# Variáveis do repositório (opcionais):
#   DEPLOY_ENV          ambiente dos .env (production | testing). Padrão: production
#   SSH_HOST            override do IP (opcional; padrão 212.85.23.26)
#
# VPS SSH: o firewall precisa aceitar TCP 22 a partir dos runners do GitHub
# (IPs em https://api.github.com/meta, chave "actions"). Timeout de conexão
# abaixo não contorna bloqueio de pacote; só espera mais se a rota for lenta.
#   /opt/carinho/carinho-com-vc-doc          clone deste repositório
#   /opt/carinho/carinho-com-vc-doc-config   clone do repo de .env
#
# Layout em carinho-com-vc-doc-config:
#   <sistema>/.env.<DEPLOY_ENV>
# O arquivo é copiado para carinho-com-vc-doc/sistemas/<sistema>/.env
#
# Depois do pull, a VPS:
#   copia os .env do repo de config
#   cria schemas (DB_DATABASE de cada .env) e aplica a senha do usuário MariaDB
#   docker compose up -d --remove-orphans na raiz (MariaDB, Redis, rede)
#   sobe só o serviço app, espera o banco/artisan, migrate --force
#   no Site: db:seed --class=LeadFormSeeder --force (formulários públicos)
#   recria worker/horizon/scheduler depois das migrations
#   (up -d sozinho não recria container já existente nem aplica env novo)

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: "8.2"
  DEPLOY_PATH: /opt/carinho/carinho-com-vc-doc
  ENV_REPO_PATH: /opt/carinho/carinho-com-vc-doc-config
  # Laravel 11.x is EOL: Composer 2.9+ blocks every 11.x release (no patched 11.x).
  # Patches exist only in laravel/framework >=12.61.1. Keep this until the apps move off 11.
  COMPOSER_NO_BLOCKING: "1"
  COMPOSER_NO_SECURITY_BLOCKING: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        system:
          - carinho-site
          - carinho-marketing
          - carinho-atendimento
          - carinho-crm
          - carinho-cuidadores
          - carinho-operacao
          - carinho-financeiro
          - carinho-documentos-lgpd
          - carinho-integracoes
    defaults:
      run:
        working-directory: sistemas/${{ matrix.system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis, zip, intl, gd, exif, xml, curl, bcmath
          coverage: none
          tools: composer

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.system }}-${{ hashFiles(format('sistemas/{0}/composer.json', matrix.system)) }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.system }}-

      - name: Composer install
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader \
            --no-scripts

      - name: Guard — Collision fora do cache versionado
        if: matrix.system == 'carinho-site'
        working-directory: ${{ github.workspace }}
        run: |
          php scripts/assert-production-package-discovery.php
          php scripts/assert-dotenv-no-unquoted-whitespace.php
          php scripts/assert-brand-whatsapp.php
          php scripts/assert-site-google-analytics.php
          php scripts/assert-financeiro-bank-account-fk-order.php
          php scripts/assert-financeiro-settings-seed.php
          php scripts/assert-app-key-before-artisan.php
          php scripts/assert-runtime-storage-not-tracked.php
          php scripts/assert-deploy-resets-dirty-tree.php
          php scripts/assert-session-driver-not-bare-database.php
          php scripts/assert-deploy-site-lead-form-seed.php

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Conferir variáveis de deploy
        env:
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'production' }}
          HAS_SSH_USER: ${{ secrets.SSH_USER != '' }}
          HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_CARINHO_VPS != '' }}
        run: |
          missing=0
          if [ "$HAS_SSH_USER" != "true" ]; then
            echo "Defina o secret SSH_USER."
            missing=1
          fi
          if [ "$HAS_SSH_KEY" != "true" ]; then
            echo "Defina o secret SSH_PRIVATE_KEY_CARINHO_VPS."
            missing=1
          fi
          if [ "$DEPLOY_ENV" != "production" ] && [ "$DEPLOY_ENV" != "testing" ]; then
            echo "DEPLOY_ENV deve ser production ou testing."
            missing=1
          fi
          if [ $missing -ne 0 ]; then
            exit 1
          fi
          echo "DEPLOY_PATH=$DEPLOY_PATH"
          echo "ENV_REPO_PATH=$ENV_REPO_PATH"
          echo "DEPLOY_ENV=$DEPLOY_ENV"

      - name: Conferir alcance SSH da VPS
        env:
          SSH_HOST: ${{ vars.SSH_HOST || '212.85.23.26' }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Testando TCP $SSH_HOST:$SSH_PORT a partir do runner GitHub..."
          if timeout 15 bash -c "echo >/dev/tcp/$SSH_HOST/$SSH_PORT"; then
            echo "Porta alcançável."
            exit 0
          fi
          echo "O runner do GitHub não consegue abrir TCP $SSH_HOST:$SSH_PORT (timeout)."
          echo "O deploy SSH não chega a autenticar: o firewall da VPS (ufw, iptables ou painel)"
          echo "precisa aceitar a porta SSH a partir dos IPs do GitHub Actions."
          echo "Lista atual: https://api.github.com/meta (campo actions)."
          echo "Teste local na VPS: ss -lnt | grep ':22' e ufw status."
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: /opt/carinho/carinho-com-vc-doc
          ENV_REPO_PATH: /opt/carinho/carinho-com-vc-doc-config
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'production' }}
        with:
          host: ${{ vars.SSH_HOST || '212.85.23.26' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_CARINHO_VPS }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          protocol: tcp4
          timeout: 2m
          command_timeout: 50m
          envs: DEPLOY_PATH,ENV_REPO_PATH,DEPLOY_ENV
          script: |
            set -e
            . /etc/profile 2>/dev/null || true
            . "$HOME/.profile" 2>/dev/null || true
            export PATH="$HOME/bin:$HOME/.config/composer/vendor/bin:/usr/local/bin:/usr/bin:$PATH"
            echo ">>> Atualizando código em $DEPLOY_PATH"
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Não há repositório Git em $DEPLOY_PATH. Clone o projeto nesse caminho antes do primeiro deploy."
              exit 1
            fi
            git -C "$DEPLOY_PATH" fetch origin
            # Views/sessões/cache do Laravel no bind-mount sujam o working tree.
            # pull --ff-only aborta; o clone de deploy deve coincidir com origin/main.
            git -C "$DEPLOY_PATH" reset --hard HEAD
            git -C "$DEPLOY_PATH" checkout main
            git -C "$DEPLOY_PATH" reset --hard origin/main

            echo ">>> Atualizando .env em $ENV_REPO_PATH"
            if [ ! -d "$ENV_REPO_PATH/.git" ]; then
              echo "Não há repositório Git em $ENV_REPO_PATH. Clone a pasta de .env nesse caminho antes do primeiro deploy."
              exit 1
            fi
            git -C "$ENV_REPO_PATH" fetch origin
            git -C "$ENV_REPO_PATH" reset --hard HEAD
            git -C "$ENV_REPO_PATH" checkout main
            git -C "$ENV_REPO_PATH" reset --hard origin/main

            echo ">>> Sobrescrevendo .env de cada sistema (DEPLOY_ENV=${DEPLOY_ENV:-production})"
            DEPLOY_ENV="${DEPLOY_ENV:-production}"
            case "$DEPLOY_ENV" in
              production|testing) ;;
              *)
                echo "DEPLOY_ENV inválido: $DEPLOY_ENV"
                exit 1
                ;;
            esac
            for system in \
              carinho-site \
              carinho-marketing \
              carinho-atendimento \
              carinho-crm \
              carinho-cuidadores \
              carinho-operacao \
              carinho-financeiro \
              carinho-documentos-lgpd \
              carinho-integracoes
            do
              dest="$DEPLOY_PATH/sistemas/$system/.env"
              if [ -f "$ENV_REPO_PATH/$system/.env.$DEPLOY_ENV" ]; then
                src="$ENV_REPO_PATH/$system/.env.$DEPLOY_ENV"
              elif [ -f "$ENV_REPO_PATH/$system/.env" ]; then
                src="$ENV_REPO_PATH/$system/.env"
              elif [ -f "$ENV_REPO_PATH/$system.env" ]; then
                src="$ENV_REPO_PATH/$system.env"
              else
                echo "Arquivo .env.$DEPLOY_ENV não encontrado para $system em $ENV_REPO_PATH"
                exit 1
              fi
              mkdir -p "$DEPLOY_PATH/sistemas/$system"
              old_key=""
              if [ -f "$dest" ]; then
                old_key="$(grep -E '^APP_KEY=' "$dest" | tail -n1 | cut -d= -f2- | tr -d '\r')"
              fi
              cp -f "$src" "$dest"
              bash "$DEPLOY_PATH/scripts/quote-dotenv-unquoted-whitespace.sh" "$dest"
              new_key="$(grep -E '^APP_KEY=' "$dest" | tail -n1 | cut -d= -f2- | tr -d '\r')"
              new_key_trim="$(printf '%s' "$new_key" | tr -d '"' | tr -d "'" | tr -d ' ')"
              old_key_trim="$(printf '%s' "$old_key" | tr -d '"' | tr -d "'" | tr -d ' ')"
              if [ -z "$new_key_trim" ] && [ -n "$old_key_trim" ]; then
                sed -i "s#^APP_KEY=.*#APP_KEY=${old_key}#" "$dest"
                echo "Atualizado $system a partir de $(basename "$src") (APP_KEY existente preservada)"
              else
                echo "Atualizado $system a partir de $(basename "$src")"
              fi
              bash "$DEPLOY_PATH/scripts/ensure-app-key.sh" "$dest"
            done

            echo ">>> Subindo containers na VPS"
            export PATH="/usr/local/bin:/usr/bin:$HOME/bin:$PATH"
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "docker compose não está disponível no PATH da VPS."
              exit 1
            fi

            echo ">>> Infra compartilhada (MariaDB, Redis, carinho-network)"
            $COMPOSE -f "$DEPLOY_PATH/docker-compose.yml" --project-directory "$DEPLOY_PATH" up -d --remove-orphans

            echo ">>> Aguardando MariaDB"
            mariadb_ready=0
            i=0
            while [ "$i" -lt 30 ]; do
              if docker exec carinho-mariadb mariadb-admin ping --silent >/dev/null 2>&1 \
                && docker exec carinho-mariadb mariadb -uroot -e 'SELECT 1' >/dev/null 2>&1; then
                echo "MariaDB pronto"
                mariadb_ready=1
                break
              fi
              i=$((i + 1))
              sleep 2
            done
            if [ "$mariadb_ready" -ne 1 ]; then
              echo "MariaDB não ficou pronto a tempo."
              exit 1
            fi

            echo ">>> Garantindo schemas e senha DB_PASSWORD no MariaDB"
            bash "$DEPLOY_PATH/scripts/sync-mariadb-app-user.sh" "$DEPLOY_PATH"

            export COMPOSER_NO_BLOCKING=1
            export COMPOSER_NO_SECURITY_BLOCKING=1
            for system in \
              carinho-site \
              carinho-marketing \
              carinho-atendimento \
              carinho-crm \
              carinho-cuidadores \
              carinho-operacao \
              carinho-financeiro \
              carinho-documentos-lgpd \
              carinho-integracoes
            do
              app="$DEPLOY_PATH/sistemas/$system"
              echo ">>> Removendo cache Laravel de packages/services — $system"
              rm -f "$app/bootstrap/cache/config.php" \
                    "$app/bootstrap/cache/packages.php" \
                    "$app/bootstrap/cache/services.php"
              echo ">>> Composer (volume bind) — $system"
              $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" run --rm --no-deps \
                -e COMPOSER_NO_BLOCKING=1 \
                -e COMPOSER_NO_SECURITY_BLOCKING=1 \
                -e COMPOSER_PROCESS_TIMEOUT=0 \
                --entrypoint composer \
                app install --no-interaction --prefer-dist --optimize-autoloader --no-scripts --no-dev
              echo ">>> Recriando app com env atual — $system"
              rm -f "$app/bootstrap/cache/config.php" \
                    "$app/bootstrap/cache/packages.php" \
                    "$app/bootstrap/cache/services.php"
              $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" up -d --build --force-recreate --no-deps app
              apache_ready=0
              j=0
              while [ "$j" -lt 90 ]; do
                if $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" exec -T app sh -c 'pgrep apache2 >/dev/null 2>&1'; then
                  apache_ready=1
                  break
                fi
                j=$((j + 1))
                sleep 2
              done
              if [ "$apache_ready" -ne 1 ]; then
                echo "Apache não subiu em $system. Logs do container:"
                $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" logs --tail 150 app || true
                $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" ps -a || true
                exit 1
              fi
              $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" exec -T app php artisan config:clear
              echo ">>> migrate --force — $system"
              $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" exec -T app php artisan migrate --force
              if [ "$system" = "carinho-site" ]; then
                echo ">>> seed LeadFormSeeder (idempotente) — $system"
                $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" exec -T app php artisan db:seed --class=LeadFormSeeder --force
              fi
              extra_services="$($COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" config --services | grep -v '^app$' || true)"
              for svc in $extra_services; do
                echo ">>> Recriando $svc com env atual — $system"
                $COMPOSE --project-directory "$app" -f "$app/docker-compose.yml" up -d --build --force-recreate --no-deps "$svc"
              done
            done
            echo ">>> Deploy concluído"
